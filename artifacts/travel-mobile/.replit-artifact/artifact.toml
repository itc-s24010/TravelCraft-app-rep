kind = "mobile"
previewPath = "/travel-mobile/"
title = "TravelCraft Mobile"
description = "TravelCraft のモバイル版コンパニオンアプリ。Firebase認証でログインし、自分が参加している旅行の一覧を確認、旅行ごとの同行メンバーを閲覧・削除（オーナーのみ）できる。既存の Spring Boot API と Firebase Auth を共有する。"
version = "1.0.0"
id = "artifacts/travel-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/travel-mobile/" ]
localPort = 22055

[services.development]
run = "pnpm --filter @workspace/travel-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/travel-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/travel-mobile", "run", "serve" ]

[services.env]
PORT = "22055"
BASE_PATH = "/travel-mobile/"
