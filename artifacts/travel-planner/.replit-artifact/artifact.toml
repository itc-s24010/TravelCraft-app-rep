kind = "web"
previewPath = "/"
title = "旅行計画アプリ (Next.js + Spring Boot)"
description = "Next.js + Supabase Auth + Spring Boot バックエンドで構築した旅行計画アプリ。旅行プランの作成・管理、交通・宿泊情報の登録、予算・支出追跡、通知設定ができる。"
version = "1.0.0"
id = "artifacts/travel-planner"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24289

[services.development]
run = "pnpm --filter @workspace/travel-next run dev"

[services.env]
PORT = "24289"
BASE_PATH = "/"
