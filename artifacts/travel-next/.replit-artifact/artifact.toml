kind = "web"
previewPath = "/travel-next"
title = "TravelCraft"
version = "1.0.0"

[[services]]
localPort = 3000
name = "Next.js Dev Server"
paths = ["/travel-next"]

[services.env]
PORT = "3000"
NEXT_PUBLIC_BASE_PATH = "/travel-next"

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/travel-next && node_modules/.bin/next dev -p ${PORT:-3000} -H 0.0.0.0'"
